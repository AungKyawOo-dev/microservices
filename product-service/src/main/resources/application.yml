server:
  port: 8081   # change to any port you want

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/e-commerce-app
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
